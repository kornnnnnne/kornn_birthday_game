<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>超連打チャレンジ！ - Rapid</title>
  <link rel="stylesheet" href="css/Rapid.css">
</head>
<body>

  <!-- 左上コントロール & コイン表示 -->
  <div id="top-left-controls" style="display: flex; justify-content: space-between; align-items: center; padding: 10px 20px;">
    <button id="back-menu-btn">メニューへ</button>
  </div>

  <div class="game-card">
    <h1>⚡ 超連打チャレンジ ⚡</h1>
    <p class="description">10秒間でボタンを何回連打できるか挑戦しよう！</p>

    <div class="status-panel">
      <div class="status-item">
        <span class="label">残り時間</span>
        <span id="time-display" class="value">10.0</span> 秒
      </div>
      <div class="status-item">
        <span class="label">連打数</span>
        <span id="score-display" class="value">0</span> 回
      </div>
    </div>

    <!-- タップ/クリック用巨大ボタン -->
    <button id="tap-btn" class="tap-btn" disabled>
      スタートを押してね！
    </button>

    <!-- コントロールボタン -->
    <div class="control-panel">
      <button id="start-btn" class="ctrl-btn start">ゲームスタート</button>
      <button id="back-btn" class="ctrl-btn back">メニューへ戻る</button>
    </div>

    <!-- 結果メッセージ -->
    <p id="result-message" class="result-message"></p>

    <!-- ★ 追加：ゲーム終了後の結果・ランキングボード -->
    <div id="result-board" style="display: none; margin-top: 20px; background: #222; padding: 15px; border-radius: 8px; text-align: left;">
      <h3 style="color: #f1c40f; margin-top: 0; text-align: center;">結果発表</h3>
      <p>あなたのハイスコア: <span id="my-highscore-display" style="color: #2ecc71; font-weight: bold;">-</span> 回</p>
      <h4 style="margin-bottom: 5px; color: #fff;">🏆 ランキング (TOP 5)</h4>
      <ul id="ranking-list" style="margin: 0; padding-left: 20px; color: #ddd; font-size: 14px;">
        <li>読み込み中...</li>
      </ul>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/Rapid.js"></script>
</body>
</html>
