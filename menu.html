
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メインメニュー</title>
  <link rel="stylesheet" href="css/menu.css">
</head>
<body>

  <div id="top-left-controls">
    <button id="logout-btn">ログアウト</button>
  </div>

  <!-- ★ 右上に配置する所持金バッジ -->
  <div id="top-right-controls">
    <div class="coin-badge">💰 <span id="coin-display">0</span> コイン</div>
  </div>

  <div id="menu-card">
    <h1>メインメニュー</h1>
    <p>ようこそ、<strong id="player-display">---</strong> さん！</p>

    <div class="menu-buttons">
      <!-- 各機能への導線ボタン -->
      <button id="to-game-btn" class="menu-btn game1">🎮 とうもろこしゲーム</button>
      <button id="to-quiz1-btn" class="menu-btn quiz1">こーんクイズ</button>
      <button id="to-quiz2-btn" class="menu-btn quiz2">プロセカクイズ</button>
      <button id="to-KanjiQuiz-btn" class="menu-btn KanjiQuiz">漢字クイズ</button>
      <button id="to-Rapid-btn" class="menu-btn Rapid">連打ゲーム</button>
      <button id="to-slot-btn" class="menu-btn slot">スロット</button>
      <button id="to-shop-btn" class="menu-btn shop">🛒 ショップ (準備中)</button>
      <button id="to-status-btn" class="menu-btn status">📊 ステータス確認</button>
      <button id="to-boss-btn" class="menu-btn boss">ボス戦</button>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
