<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メインメニュー</title>
  <link rel="stylesheet" href="css/menu.css">
</head>
<body>

  <!-- 左上のログアウト -->
  <div id="top-left-controls">
    <button id="logout-btn" class="sub-btn">ログアウト</button>
  </div>

  <div class="menu-card">
    <h1>メインメニュー</h1>
    <p class="subtitle">ようこそ、<strong id="player-display">---</strong> さん！</p>

    <!-- ミニゲームセクション -->
    <div class="menu-section">
      <h3>🎮 ミニゲーム</h3>
      <div class="button-grid">
        <button id="to-game-btn" class="menu-btn game1">とうもろこし</button>
        <button id="to-quiz1-btn" class="menu-btn quiz1">こーんクイズ</button>
        <button id="to-quiz2-btn" class="menu-btn quiz2">プロセカクイズ</button>
        <button id="to-KanjiQuiz-btn" class="menu-btn KanjiQuiz">漢字クイズ</button>
        <button id="to-Rapid-btn" class="menu-btn Rapid">連打ゲーム</button>
      </div>
    </div>

    <!-- 冒険・育成セクション -->
    <div class="menu-section">
      <h3>⚔️ 冒険 </h3>
      <div class="button-grid">
        <button id="to-battle-btn" class="menu-btn battle">⚔️ 雑魚敵討伐</button>
        <button id="to-boss-btn" class="menu-btn boss">👑 ボス戦</button>
        <button id="to-slot-btn" class="menu-btn slot">🎰 スロット</button>
        <button id="to-shop-btn" class="menu-btn shop">🛒 ショップ</button>
        <button id="to-status-btn" class="menu-btn status" style="grid-column: span 2;">📊 ステータス確認</button>
      </div>
    </div>

    <!-- ★ ストーリー（小説）セクションを追加 -->
    <div class="menu-section">
      <h3>📖 ストーリー (短編小説)</h3>
      <div class="button-grid">
        <button id="to-story1-btn" class="menu-btn story-btn" disabled>ストーリー 1</button>
        <button id="to-story2-btn" class="menu-btn story-btn" disabled>ストーリー 2</button>
        <button id="to-story3-btn" class="menu-btn story-btn" disabled>ストーリー 3</button>
        <button id="to-story4-btn" class="menu-btn story-btn" disabled>ストーリー 4</button>
      </div>
      <!-- ★ 称号がある場合に表示され、「製作者から」とあわせて読めるエリア -->
      <div id="special-reward-section" style="display: none; margin-top: 15px; border-top: 1px dashed #555; padding-top: 15px;">
        <p id="player-title-display" style="font-size: 14px; color: #f1c40f; margin-bottom: 10px; font-weight: bold;"></p>
        <div class="button-grid" style="margin-top: 10px;">
          <button id="to-story4-btn" class="menu-btn story-btn" disabled>プロローグ</button>
          <button id="to-story5-btn" class="menu-btn story-btn" disabled>製作者より</button> 
        </div>
      </div>
    </div>

  </div>

  <script src="js/config.js"></script>
  <script src="js/bgm.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
