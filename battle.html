<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>モンスター討伐クエスト - Battle</title>
</head>
<body>

  <!-- 左上コントロール & 所持コイン表示 -->
  <div id="top-left-controls" style="display: flex; justify-content: space-between; align-items: center; padding: 10px 20px;">
    <button id="back-menu-btn">メニューへ</button>
    <div style="color: #f1c40f; font-weight: bold; font-size: 16px;">
      💰 所持コイン: <span id="coin-display">0</span>
    </div>
  </div>

  <!-- ① 難易度選択画面 -->
  <div id="difficulty-select-screen" class="game-card" style="text-align: center;">
    <h1>⚔️ モンスター討伐クエスト ⚔️</h1>
    <p class="description">挑む難易度を選んで、現れるモンスターと戦おう！</p>
    <div style="display: flex; flex-direction: column; gap: 12px; max-width: 320px; margin: 30px auto;">
      <button class="ctrl-btn diff-btn" data-diff="easy" style="background-color: #27ae60;">🟢 初級に挑む</button>
      <button class="ctrl-btn diff-btn" data-diff="normal" style="background-color: #f39c12;">🟡 中級に挑む</button>
      <button class="ctrl-btn diff-btn" data-diff="hard" style="background-color: #c0392b;">🔴 上級に挑む</button>
    </div>
  </div>

  <!-- ② バトル画面 -->
  <div id="battle-screen" class="game-card" style="display: none; text-align: center;">
    <h1 id="enemy-title">⚔️ バトル開始 ⚔️</h1>

    <!-- ステータス表示エリア -->
    <div style="display: flex; justify-content: space-around; margin: 20px 0; background: #222; padding: 15px; border-radius: 8px;">
      <!-- プレイヤー -->
      <div>
        <p id="player-name" style="font-weight: bold; margin: 0 0 5px 0;"></p>
        <p style="margin: 0 0 5px 0;">HP: <span id="player-current-hp">100</span> / <span id="player-max-hp">100</span></p>
        <div style="width: 120px; background: #555; height: 12px; border-radius: 6px; overflow: hidden; margin: 0 auto;">
          <div id="player-hp-gauge" style="width: 100%; background: #2ecc71; height: 100%; transition: width 0.3s;"></div>
        </div>
      </div>
      <!-- 敵 -->
      <div>
        <p id="enemy-name-display" style="font-weight: bold; margin: 0 0 5px 0; color: #e74c3c;"></p>
        <p style="margin: 0 0 5px 0;">HP: <span id="enemy-current-hp">50</span> / <span id="enemy-max-hp">50</span></p>
        <div style="width: 120px; background: #555; height: 12px; border-radius: 6px; overflow: hidden; margin: 0 auto;">
          <div id="enemy-hp-gauge" style="width: 100%; background: #e74c3c; height: 100%; transition: width 0.3s;"></div>
        </div>
      </div>
    </div>

    <!-- ログ出力ボックス -->
    <div id="log-box" style="background: #111; color: #fff; text-align: left; padding: 15px; height: 120px; overflow-y: auto; border-radius: 8px; font-family: monospace; font-size: 14px; margin-bottom: 20px; border: 1px solid #444;">
      バトルが始まった！
    </div>

    <!-- コマンドパネル（通常） -->
    <div id="command-box" style="display: flex; justify-content: center; gap: 10px;">
      <button id="attack-btn" class="ctrl-btn" style="background-color: #e67e22;">攻撃する</button>
      <button id="item-select-toggle-btn" class="ctrl-btn" style="background-color: #27ae60;">アイテムを使う</button>
      <button id="escape-btn" class="ctrl-btn back" style="background-color: #7f8c8d;">逃げる</button>
    </div>

    <!-- アイテム選択用領域（最初は非表示） -->
    <div id="item-command-box" style="display: none; text-align: center;">
      <div id="item-buttons-container" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; margin-bottom: 10px;"></div>
      <button id="back-to-main-btn" class="ctrl-btn back" style="background-color: #7f8c8d;">もどる</button>
    </div>

    <!-- 勝利後用メニューに戻るボタン -->
    <button id="to-menu-btn" class="ctrl-btn back" style="display: none; margin: 20px auto 0 auto; background-color: #2980b9;">メニューに戻る</button>
  </div>

  <script src="js/config.js"></script>
  <script src="js/battle.js"></script>
</body>
</html>
