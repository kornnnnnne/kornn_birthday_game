<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>とうもろこしキャッチゲーム</title>
  <link rel="stylesheet" href="game1.css">
</head>
<body>

  <!-- ★ 左上のログアウトボタンエリア -->
  <div id="top-left-controls">
    <button id="logout-btn">ログアウト</button>
  </div>

  <div id="game">
    <h1>とうもろこし収穫ゲーム</h1>
    
    <!-- プレイヤー名表示 & ログアウトボタン -->
    <div style="margin-bottom: 10px;">
      <span>プレイヤー: <strong id="player-display">---</strong></span>
    </div>

    <div class="status-board">
      <span>スコア: <span id="score">0</span></span> | 
      <span>残り時間: <span id="timer">30</span>秒</span>
    </div>

    <!-- スタートボタン -->
    <button id="start-btn">ゲームスタート！</button>

    <!-- とうもろこしが出現するエリア -->
    <div id="game-area">
      <div id="corn" class="corn" style="display: none;">🌽</div>
    </div>

    <!-- ★ 結果＆ランキング表示エリア（初期状態は非表示） -->
    <div id="result-board" style="display: none;">
      <h2>🎉 ゲーム終了！ 🎉</h2>
      <p class="score-summary">今回のスコア: <strong id="current-score-display">0</strong> 点</p>
      <p class="score-summary">あなたのハイスコア: <strong id="my-highscore-display">0</strong> 点</p>
      
      <h3>🏆 ランキング TOP 5 🏆</h3>
      <ol id="ranking-list">
        <!-- JSでここに上位5人が追加されます -->
      </ol>
    </div>
  </div>

  <script src="game1.js"></script>
</body>
</html>
