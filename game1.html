<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>とうもろこしキャッチゲーム</title>
  <link rel="stylesheet" href="game1.css">
</head>
<body>

  <div id="game">
    <h1>とうもろこし収穫ゲーム</h1>
    
    <div class="status-board">
      <span>スコア: <span id="score">0</span></span> | 
      <span>残り時間: <span id="timer">10</span>秒</span>
    </div>
    <!-- status-board の下あたりに追加 -->
    <div style="margin-bottom: 10px;">
      <label for="player-name">プレイヤー名: </label>
      <input type="text" id="player-name" value="ゲスト" placeholder="名前を入力">
    </div>

    <!-- スタートボタン -->
    <button id="start-btn">ゲームスタート！</button>

    <!-- とうもろこしが出現するエリア -->
    <div id="game-area">
      <div id="corn" class="corn" style="display: none;">🌽</div>
    </div>
  </div>

  <script src="game1.js"></script>
</body>
</html>
