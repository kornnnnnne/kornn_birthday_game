<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ステータス確認</title>
  <link rel="stylesheet" href="status.css"> <!-- 共通のCSSがあれば -->
</head>
<body>

  <h1>プレイヤー ステータス</h1>
  <p>ログイン中: <span id="player-display"></span></p>

  <div class="status-card">
    <div class="status-item"><span>❤️ HP:</span> <strong id="stat-hp">-</strong></div>
    <div class="status-item"><span>✨ MP:</span> <strong id="stat-mp">-</strong></div>
    <div class="status-item"><span>⚔️ 攻撃力:</span> <strong id="stat-attack">-</strong></div>
    <div class="status-item"><span>🔮 魔法攻撃力:</span> <strong id="stat-magicAttack">-</strong></div>
    <div class="status-item"><span>🛡️ 防御力:</span> <strong id="stat-defense">-</strong></div>
    <div class="status-item"><span>🛡️✨ 魔法防御力:</span> <strong id="stat-magicDefense">-</strong></div>
  </div>

  <button class="back-btn" onclick="location.href='menu.html'">メニューに戻る</button>

  <!-- 設定ファイルと専用JS -->
  <script src="config.js"></script>
  <script src="status.js"></script>
</body>
</html>
