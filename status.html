<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ステータス確認</title>
  <link rel="stylesheet" href="style.css"> <!-- 共通のCSSがあれば -->
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; background: #f4f7f6; }
    .status-card { background: white; max-width: 400px; margin: 20px auto; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: left; }
    .status-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; font-size: 18px; }
    .back-btn { margin-top: 20px; padding: 10px 20px; background: #6c757d; color: white; border: none; border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>

  <h1>プレイヤー ステータス</h1>
  <p>ログイン中: <span id="player-display"></span></p>

  <div class="status-card">
    <div class="status-item"><span>❤️ HP:</span> <strong id="stat-hp">-</strong></div>
    <div class="status-item"><span>✨ MP:</span> <strong id="stat-mp">-</strong></div>
    <div class="status-item"><span>⚔️ 攻撃力:</span> <strong id="stat-attack">-</strong></div>
    <div class="status-item"><span>🔮 魔法攻撃力:</span> <strong id="stat-magicAttack">-</strong></div>
    <div class="status-item"><span>🛡️ 防御力:</span> <strong id="stat-defense">-</strong></div>
    <div class="status-item"><span>🛡️✨ 魔法防御力:</span> <strong id="stat-magicDefense">-</strong></div>
  </div>

  <button class="back-btn" onclick="location.href='menu.html'">メニューに戻る</button>

  <!-- 設定ファイルと専用JS -->
  <script src="config.js"></script>
  <script src="status.js"></script>
</body>
</html>
